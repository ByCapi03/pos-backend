server:
  port: 8000

spring:
  application:
    name: pos-backend-spring
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:9638660}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SMTP_USE_TLS:true}

app:
  auth:
    auto-activate-on-email-fail: false
  jwt:
    secret: ${JWT_SECRET_KEY:changeme-super-secret-key-change-in-production-32b}
    algorithm: ${JWT_ALGORITHM:HS256}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  verification:
    expiration-minutes: ${VERIFICATION_CODE_EXPIRATION_MINUTES:15}
    max-attempts: ${VERIFICATION_CODE_MAX_ATTEMPTS:3}
  invitation:
    expiration-hours: ${INVITATION_EXPIRATION_HOURS:72}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://pos-frontend-si2.duckdns.org}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mail-from: ${MAIL_FROM:}
  media-dir: ${MEDIA_DIR:media}
  xml-dir: ${XML_DIR:XMLS}

management:
  endpoints:
    web:
      exposure:
        include: health,info
